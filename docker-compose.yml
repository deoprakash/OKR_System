version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: okr_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: okr_backend/Dockerfile
    container_name: okr_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/okr_system
      - CLIENT_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
